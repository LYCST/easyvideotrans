<!DOCTYPE html>
<html>
<head>
    <title>EasyVideoTrans API 测试界面</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <script src="{{ url_for('static', filename='jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='popper.min.js') }}"></script>
    <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
    <style>
        .api-section {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
        }
        .api-section h3 {
            color: #007bff;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .btn-test {
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .response-area {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
        }
        .nav-tabs {
            margin-bottom: 20px;
        }
        .tab-content {
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div style="text-align: center">
    <img src="{{ url_for('static', filename='cartography.png') }}">
</div>

<div style="text-align: center; background-color: yellow; color: black; padding: 10px;">
    EasyVideoTrans API 测试界面 - 支持所有接口测试
</div>

<div class="container-fluid">
    <!-- 导航标签 -->
    <ul class="nav nav-tabs" id="apiTabs" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" id="video-tab" data-toggle="tab" href="#video" role="tab">视频处理</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="audio-tab" data-toggle="tab" href="#audio" role="tab">音频处理</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="subtitle-tab" data-toggle="tab" href="#subtitle" role="tab">字幕处理</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="translation-tab" data-toggle="tab" href="#translation" role="tab">翻译服务</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="tts-tab" data-toggle="tab" href="#tts" role="tab">语音合成</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="synthesis-tab" data-toggle="tab" href="#synthesis" role="tab">视频合成</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="download-tab" data-toggle="tab" href="#download" role="tab">文件下载</a>
        </li>
    </ul>

    <!-- 标签内容 -->
    <div class="tab-content" id="apiTabContent">
        <!-- 视频处理标签 -->
        <div class="tab-pane fade show active" id="video" role="tabpanel">
            <div class="row">
                <div class="col-md-6">
                    <div class="api-section">
                        <h3>上传视频文件</h3>
                        <form id="uploadForm">
                            <div class="form-group">
                                <label for="videoFile">选择视频文件:</label>
                                <input type="file" class="form-control-file" id="videoFile" accept=".mp4,.avi,.mov">
                            </div>
                            <button type="submit" class="btn btn-primary btn-test">上传视频</button>
                        </form>
                        <div class="response-area" id="uploadResponse"></div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="api-section">
                        <h3>下载 YouTube 视频</h3>
                        <form id="ytDownloadForm">
                            <div class="form-group">
                                <label for="ytVideoId">YouTube 视频 ID:</label>
                                <input type="text" class="form-control" id="ytVideoId" placeholder="例如: Am54LhN2NLk">
                            </div>
                            <button type="submit" class="btn btn-primary btn-test">下载视频</button>
                        </form>
                        <div class="response-area" id="ytDownloadResponse"></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="api-section">
                        <h3>获取 YouTube 缩略图</h3>
                        <form id="ytThumbnailForm">
                            <div class="form-group">
                                <label for="ytThumbnailId">YouTube 视频 ID:</label>
                                <input type="text" class="form-control" id="ytThumbnailId" placeholder="例如: Am54LhN2NLk">
                            </div>
                            <button type="submit" class="btn btn-primary btn-test">获取缩略图</button>
                        </form>
                        <div class="response-area" id="ytThumbnailResponse"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 音频处理标签 -->
        <div class="tab-pane fade" id="audio" role="tabpanel">
            <div class="row">
                <div class="col-md-6">
                    <div class="api-section">
                        <h3>提取音频</h3>
                        <form id="extractAudioForm">
                            <div class="form-group">
                                <label for="extractAudioId">视频 ID:</label>
                                <input type="text" class="form-control" id="extractAudioId" placeholder="输入视频ID">
                            </div>
                            <button type="submit" class="btn btn-primary btn-test">提取音频</button>
                        </form>
                        <div class="response-area" id="extractAudioResponse"></div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="api-section">
                        <h3>移除音频背景音乐</h3>
                        <form id="removeBgForm">
                            <div class="form-group">
                                <label for="removeBgId">视频 ID:</label>
                                <input type="text" class="form-control" id="removeBgId" placeholder="输入视频ID">
                            </div>
                            <button type="submit" class="btn btn-primary btn-test">移除背景音乐</button>
                        </form>
                        <div class="response-area" id="removeBgResponse"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 字幕处理标签 -->
        <div class="tab-pane fade" id="subtitle" role="tabpanel">
            <div class="row">
                <div class="col-md-6">
                    <div class="api-section">
                        <h3>语音识别生成字幕</h3>
                        <form id="transcribeForm">
                            <div class="form-group">
                                <label for="transcribeId">视频 ID:</label>
                                <input type="text" class="form-control" id="transcribeId" placeholder="输入视频ID">
                            </div>
                            <button type="submit" class="btn btn-primary btn-test">生成字幕</button>
                        </form>
                        <div class="response-area" id="transcribeResponse"></div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="api-section">
                        <h3>生成双语字幕</h3>
                        <form id="bilingualForm">
                            <div class="form-group">
                                <label for="bilingualId">视频 ID:</label>
                                <input type="text" class="form-control" id="bilingualId" placeholder="输入视频ID">
                            </div>
                            <button type="submit" class="btn btn-primary btn-test">生成双语字幕</button>
                        </form>
                        <div class="response-area" id="bilingualResponse"></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="api-section">
                        <h3>上传修改后的字幕</h3>
                        <form id="uploadSubtitleForm">
                            <div class="form-group">
                                <label for="uploadSubtitleId">视频 ID:</label>
                                <input type="text" class="form-control" id="uploadSubtitleId" placeholder="输入视频ID">
                            </div>
                            <div class="form-group">
                                <label for="subtitleFile">字幕文件:</label>
                                <input type="file" class="form-control-file" id="subtitleFile" accept=".srt">
                            </div>
                            <button type="submit" class="btn btn-primary btn-test">上传字幕</button>
                        </form>
                        <div class="response-area" id="uploadSubtitleResponse"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 翻译服务标签 -->
        <div class="tab-pane fade" id="translation" role="tabpanel">
            <div class="api-section">
                <h3>翻译字幕为中文</h3>
                <form id="translateForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="translateId">视频 ID:</label>
                                <input type="text" class="form-control" id="translateId" placeholder="输入视频ID">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="sourceLang">源语言:</label>
                                <input type="text" class="form-control" id="sourceLang" value="en" placeholder="例如: en">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="translateVendor">翻译服务商:</label>
                                <select class="form-control" id="translateVendor">
                                    <option value="google">Google Translate (免费)</option>
                                    <option value="deepl">DeepL (需要API密钥)</option>
                                    <option value="gpt-3.5-turbo-0125">ChatGPT 3.5 Turbo</option>
                                    <option value="gpt-4">ChatGPT 4</option>
                                    <option value="gpt-4-turbo">ChatGPT 4 Turbo</option>
                                    <option value="gpt-local">本地部署</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="translateKey">API 密钥:</label>
                                <input type="text" class="form-control" id="translateKey" placeholder="输入API密钥">
                            </div>
                        </div>
                    </div>
                    
                    <div class="row" id="localConfig" style="display: none;">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="baseUrl">API 基础 URL:</label>
                                <input type="text" class="form-control" id="baseUrl" placeholder="http://localhost:11434/v1/">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="modelName">模型名称:</label>
                                <input type="text" class="form-control" id="modelName" placeholder="qwen2.5:7b">
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-test">翻译字幕</button>
                </form>
                <div class="response-area" id="translateResponse"></div>
            </div>
        </div>

        <!-- 语音合成标签 -->
        <div class="tab-pane fade" id="tts" role="tabpanel">
            <div class="api-section">
                <h3>语音合成 (TTS)</h3>
                <form id="ttsForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="ttsId">视频 ID:</label>
                                <input type="text" class="form-control" id="ttsId" placeholder="输入视频ID">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="ttsVendor">TTS 引擎:</label>
                                <select class="form-control" id="ttsVendor">
                                    <option value="edge">Edge TTS (微软)</option>
                                    <option value="openai">OpenAI TTS</option>
                                    <option value="xtts_v2">XTTS v2 (Coqui TTS)</option>
                                    <option value="cosyvoice2">CosyVoice2 (腾讯)</option>
                                    <option value="fallback">Fallback TTS</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Edge TTS 配置 -->
                    <div id="edgeConfig" class="tts-config">
                        <div class="form-group">
                            <label for="ttsCharacter">语音角色:</label>
                            <input type="text" class="form-control" id="ttsCharacter" value="zh-CN-XiaoyiNeural">
                        </div>
                    </div>
                    
                    <!-- OpenAI TTS 配置 -->
                    <div id="openaiConfig" class="tts-config" style="display: none;">
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="openaiVoice">语音类型:</label>
                                    <select class="form-control" id="openaiVoice">
                                        <option value="alloy">Alloy</option>
                                        <option value="echo">Echo</option>
                                        <option value="fable">Fable</option>
                                        <option value="onyx">Onyx</option>
                                        <option value="nova">Nova</option>
                                        <option value="shimmer">Shimmer</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="openaiModel">模型:</label>
                                    <select class="form-control" id="openaiModel">
                                        <option value="tts-1">TTS-1</option>
                                        <option value="tts-1-hd">TTS-1-HD</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="openaiInstructions">指令:</label>
                                    <input type="text" class="form-control" id="openaiInstructions" placeholder="例如：用缓慢、清晰的语调说话">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- XTTS v2 配置 -->
                    <div id="xttsConfig" class="tts-config" style="display: none;">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="xttsAudioSource">参考音频来源:</label>
                                    <select class="form-control" id="xttsAudioSource">
                                        <option value="upload">上传音频文件</option>
                                        <option value="video_voice" selected>使用视频原始人声</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="xttsLanguage">目标语言:</label>
                                    <select class="form-control" id="xttsLanguage">
                                        <option value="zh">中文</option>
                                        <option value="en">英文</option>
                                        <option value="ja">日文</option>
                                        <option value="ko">韩文</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="xttsModelName">模型名称:</label>
                            <input type="text" class="form-control" id="xttsModelName" value="tts_models/multilingual/multi-dataset/xtts_v2">
                        </div>
                    </div>
                    
                    <!-- CosyVoice2 配置 -->
                    <div id="cosyvoiceConfig" class="tts-config" style="display: none;">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="cosyvoiceAudioSource">参考音频来源:</label>
                                    <select class="form-control" id="cosyvoiceAudioSource">
                                        <option value="upload">上传音频文件</option>
                                        <option value="video_voice" selected>使用视频原始人声</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="cosyvoiceSpeakerName">说话人名称:</label>
                                    <input type="text" class="form-control" id="cosyvoiceSpeakerName" value="希望你以后能够做的比我还好呦。">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="cosyvoiceMode">生成模式:</label>
                                    <select class="form-control" id="cosyvoiceMode">
                                        <option value="zero_shot">零样本模式</option>
                                        <option value="cross_lingual" selected>跨语种模式</option>
                                        <option value="instruct">指令模式</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="cosyvoiceInstruction">指令:</label>
                                    <input type="text" class="form-control" id="cosyvoiceInstruction" value="用四川话说这句话">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-test">生成语音</button>
                </form>
                <div class="response-area" id="ttsResponse"></div>
            </div>
        </div>

        <!-- 视频合成标签 -->
        <div class="tab-pane fade" id="synthesis" role="tabpanel">
            <div class="api-section">
                <h3>视频合成</h3>
                <form id="videoPreviewForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="videoPreviewId">视频 ID:</label>
                                <input type="text" class="form-control" id="videoPreviewId" placeholder="输入视频ID">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="audioType">音频类型:</label>
                                <select class="form-control" id="audioType">
                                    <option value="translated">翻译后的音频</option>
                                    <option value="original">原始音频</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="forceRender">
                                <label class="form-check-label" for="forceRender">强制重新渲染</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="hardcodeSubtitles">
                                <label class="form-check-label" for="hardcodeSubtitles">硬编码字幕</label>
                            </div>
                        </div>
                    </div>
                    
                                         <div id="subtitleConfig" style="display: none;">
                         <div class="row">
                             <div class="col-md-6">
                                 <div class="form-group">
                                     <label for="subtitleType">字幕类型:</label>
                                     <select class="form-control" id="subtitleType">
                                         <option value="translated">翻译字幕（中文）</option>
                                         <option value="original">原始字幕（英文）</option>
                                         <option value="bilingual">双语字幕（中英文）</option>
                                     </select>
                                 </div>
                             </div>
                             <div class="col-md-6">
                                 <div class="form-group">
                                     <label for="fontName">主字体:</label>
                                     <select class="form-control" id="fontName">
                                         <option value="Arial">Arial</option>
                                         <option value="SimHei">黑体</option>
                                         <option value="SimSun">宋体</option>
                                         <option value="Microsoft YaHei">微软雅黑</option>
                                     </select>
                                 </div>
                             </div>
                         </div>
                         <div class="row">
                             <div class="col-md-6">
                                 <div class="form-group">
                                     <label for="fontSize">主字体大小:</label>
                                     <input type="number" class="form-control" id="fontSize" value="24" min="10" max="48">
                                 </div>
                             </div>
                             <div class="col-md-6">
                                 <div class="form-check">
                                     <input type="checkbox" class="form-check-input" id="autoScale" checked>
                                     <label class="form-check-label" for="autoScale">自适应字体大小</label>
                                 </div>
                             </div>
                         </div>
                         
                         <!-- 双语字幕配置 -->
                         <div id="bilingualConfig" style="display: none;">
                             <h5>双语字幕配置</h5>
                             <div class="row">
                                 <div class="col-md-6">
                                     <div class="form-group">
                                         <label for="secondaryFontName">副字体:</label>
                                         <select class="form-control" id="secondaryFontName">
                                             <option value="SimHei">黑体</option>
                                             <option value="Arial">Arial</option>
                                             <option value="SimSun">宋体</option>
                                             <option value="Microsoft YaHei">微软雅黑</option>
                                         </select>
                                     </div>
                                 </div>
                                 <div class="col-md-6">
                                     <div class="form-group">
                                         <label for="secondaryFontSize">副字体大小:</label>
                                         <input type="number" class="form-control" id="secondaryFontSize" value="28" min="10" max="48">
                                     </div>
                                 </div>
                             </div>
                             <div class="row">
                                 <div class="col-md-6">
                                     <div class="form-group">
                                         <label for="secondaryColor">副字体颜色:</label>
                                         <input type="color" class="form-control" id="secondaryColor" value="#cccccc">
                                     </div>
                                 </div>
                                 <div class="col-md-6">
                                     <div class="form-group">
                                         <label for="verticalSpacing">中英文字幕间距:</label>
                                         <input type="number" class="form-control" id="verticalSpacing" value="5" min="0" max="50">
                                     </div>
                                 </div>
                             </div>
                         </div>
                     </div>
                    
                    <button type="submit" class="btn btn-primary btn-test">生成视频</button>
                </form>
                <div class="response-area" id="videoPreviewResponse"></div>
            </div>
        </div>

        <!-- 文件下载标签 -->
        <div class="tab-pane fade" id="download" role="tabpanel">
            <div class="row">
                <div class="col-md-6">
                    <div class="api-section">
                        <h3>下载文件</h3>
                        <div class="form-group">
                            <label for="downloadId">视频 ID:</label>
                            <input type="text" class="form-control" id="downloadId" placeholder="输入视频ID">
                        </div>
                        
                                                 <div class="btn-group-vertical" role="group">
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('yt')">下载视频</button>
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('audio')">下载音频</button>
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('audio_no_bg')">下载人声音频</button>
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('audio_bg')">下载背景音乐</button>
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('srt_en')">下载英文字幕</button>
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('srt_en_merged')">下载英文合并字幕</button>
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('srt_zh_merged')">下载中文字幕</button>
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('srt_bilingual')">下载双语字幕</button>
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('tts')">下载TTS音频</button>
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('voice_connect')">下载连接语音</button>
                             <button type="button" class="btn btn-secondary btn-test" onclick="downloadFile('voice_connect_log')">下载语音连接日志</button>
                         </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="api-section">
                        <h3>语音连接</h3>
                        <form id="voiceConnectForm">
                            <div class="form-group">
                                <label for="voiceConnectId">视频 ID:</label>
                                <input type="text" class="form-control" id="voiceConnectId" placeholder="输入视频ID">
                            </div>
                            <button type="submit" class="btn btn-primary btn-test">连接语音</button>
                        </form>
                        <div class="response-area" id="voiceConnectResponse"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    // 翻译服务商切换
    $("#translateVendor").change(function() {
        var vendor = $(this).val();
        if (vendor === "gpt-local") {
            $("#localConfig").show();
        } else {
            $("#localConfig").hide();
        }
    });
    
    // TTS 引擎切换
    $("#ttsVendor").change(function() {
        var vendor = $(this).val();
        $(".tts-config").hide();
        if (vendor === "edge") {
            $("#edgeConfig").show();
        } else if (vendor === "openai") {
            $("#openaiConfig").show();
        } else if (vendor === "xtts_v2") {
            $("#xttsConfig").show();
        } else if (vendor === "cosyvoice2") {
            $("#cosyvoiceConfig").show();
        }
    });
    
    // 硬编码字幕切换
    $("#hardcodeSubtitles").change(function() {
        if ($(this).is(':checked')) {
            $("#subtitleConfig").show();
        } else {
            $("#subtitleConfig").hide();
        }
    });
    
    // 字幕类型切换
    $("#subtitleType").change(function() {
        var subtitleType = $(this).val();
        if (subtitleType === "bilingual") {
            $("#bilingualConfig").show();
        } else {
            $("#bilingualConfig").hide();
        }
    });
    
    // 上传视频
    $("#uploadForm").submit(function(e) {
        e.preventDefault();
        var formData = new FormData();
        formData.append('file', $("#videoFile")[0].files[0]);
        
        $.ajax({
            url: '/video_upload',
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            success: function(response) {
                $("#uploadResponse").html(JSON.stringify(response, null, 2));
            },
            error: function(xhr) {
                $("#uploadResponse").html("错误: " + xhr.responseText);
            }
        });
    });
    
    // 下载 YouTube 视频
    $("#ytDownloadForm").submit(function(e) {
        e.preventDefault();
        $.ajax({
            url: '/yt_download',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                video_id: $("#ytVideoId").val()
            }),
            success: function(response) {
                $("#ytDownloadResponse").html(JSON.stringify(response, null, 2));
            },
            error: function(xhr) {
                $("#ytDownloadResponse").html("错误: " + xhr.responseText);
            }
        });
    });
    
    // 获取 YouTube 缩略图
    $("#ytThumbnailForm").submit(function(e) {
        e.preventDefault();
        $.ajax({
            url: '/yt_thumbnail',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                video_id: $("#ytThumbnailId").val()
            }),
            success: function(response) {
                $("#ytThumbnailResponse").html("缩略图获取成功");
            },
            error: function(xhr) {
                $("#ytThumbnailResponse").html("错误: " + xhr.responseText);
            }
        });
    });
    
    // 提取音频
    $("#extractAudioForm").submit(function(e) {
        e.preventDefault();
        $.ajax({
            url: '/extra_audio',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                video_id: $("#extractAudioId").val()
            }),
            success: function(response) {
                $("#extractAudioResponse").html(JSON.stringify(response, null, 2));
            },
            error: function(xhr) {
                $("#extractAudioResponse").html("错误: " + xhr.responseText);
            }
        });
    });
    
    // 移除背景音乐
    $("#removeBgForm").submit(function(e) {
        e.preventDefault();
        $.ajax({
            url: '/remove_audio_bg',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                video_id: $("#removeBgId").val()
            }),
            success: function(response) {
                $("#removeBgResponse").html(JSON.stringify(response, null, 2));
            },
            error: function(xhr) {
                $("#removeBgResponse").html("错误: " + xhr.responseText);
            }
        });
    });
    
    // 语音识别
    $("#transcribeForm").submit(function(e) {
        e.preventDefault();
        $.ajax({
            url: '/transcribe',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                video_id: $("#transcribeId").val()
            }),
            success: function(response) {
                $("#transcribeResponse").html(JSON.stringify(response, null, 2));
            },
            error: function(xhr) {
                $("#transcribeResponse").html("错误: " + xhr.responseText);
            }
        });
    });
    
    // 生成双语字幕
    $("#bilingualForm").submit(function(e) {
        e.preventDefault();
        $.ajax({
            url: '/generate_bilingual_srt',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                video_id: $("#bilingualId").val()
            }),
            success: function(response) {
                $("#bilingualResponse").html(JSON.stringify(response, null, 2));
            },
            error: function(xhr) {
                $("#bilingualResponse").html("错误: " + xhr.responseText);
            }
        });
    });
    
    // 上传字幕
    $("#uploadSubtitleForm").submit(function(e) {
        e.preventDefault();
        var formData = new FormData();
        formData.append('video_id', $("#uploadSubtitleId").val());
        formData.append('file', $("#subtitleFile")[0].files[0]);
        
        $.ajax({
            url: '/translated_zh_upload',
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            success: function(response) {
                $("#uploadSubtitleResponse").html(JSON.stringify(response, null, 2));
            },
            error: function(xhr) {
                $("#uploadSubtitleResponse").html("错误: " + xhr.responseText);
            }
        });
    });
    
    // 翻译字幕
    $("#translateForm").submit(function(e) {
        e.preventDefault();
        var data = {
            video_id: $("#translateId").val(),
            source_lang: $("#sourceLang").val(),
            translate_vendor: $("#translateVendor").val(),
            translate_key: $("#translateKey").val()
        };
        
        if ($("#translateVendor").val() === "gpt-local") {
            data.base_url = $("#baseUrl").val();
            data.model_name = $("#modelName").val();
        }
        
        $.ajax({
            url: '/translate_to_zh',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response) {
                $("#translateResponse").html(JSON.stringify(response, null, 2));
            },
            error: function(xhr) {
                $("#translateResponse").html("错误: " + xhr.responseText);
            }
        });
    });
    
    // TTS
    $("#ttsForm").submit(function(e) {
        e.preventDefault();
        var data = {
            video_id: $("#ttsId").val(),
            tts_vendor: $("#ttsVendor").val()
        };
        
        var vendor = $("#ttsVendor").val();
        if (vendor === "edge") {
            data.tts_character = $("#ttsCharacter").val();
        } else if (vendor === "openai") {
            data.voice = $("#openaiVoice").val();
            data.model = $("#openaiModel").val();
            data.instructions = $("#openaiInstructions").val();
        } else if (vendor === "xtts_v2") {
            data.language = $("#xttsLanguage").val();
            data.model_name = $("#xttsModelName").val();
            data.audio_source = $("#xttsAudioSource").val();
        } else if (vendor === "cosyvoice2") {
            data.speaker_name = $("#cosyvoiceSpeakerName").val();
            data.mode = $("#cosyvoiceMode").val();
            data.instruction = $("#cosyvoiceInstruction").val();
            data.audio_source = $("#cosyvoiceAudioSource").val();
        }
        
        $.ajax({
            url: '/tts',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response) {
                $("#ttsResponse").html(JSON.stringify(response, null, 2));
            },
            error: function(xhr) {
                $("#ttsResponse").html("错误: " + xhr.responseText);
            }
        });
    });
    
         // 视频预览
     $("#videoPreviewForm").submit(function(e) {
         e.preventDefault();
         var data = {
             video_id: $("#videoPreviewId").val(),
             audio_type: $("#audioType").val(),
             force_render: $("#forceRender").is(':checked'),
             hardcode_subtitles: $("#hardcodeSubtitles").is(':checked')
         };
         
         if ($("#hardcodeSubtitles").is(':checked')) {
             data.subtitle_type = $("#subtitleType").val();
             data.subtitle_style = {
                 font_name: $("#fontName").val(),
                 font_size: parseInt($("#fontSize").val()),
                 auto_scale: $("#autoScale").is(':checked')
             };
             
             // 如果是双语字幕，添加双语配置
             if ($("#subtitleType").val() === "bilingual") {
                 data.subtitle_style.bilingual = {
                     secondary_font_name: $("#secondaryFontName").val(),
                     secondary_font_size: parseInt($("#secondaryFontSize").val()),
                     secondary_color: hexToAssColor($("#secondaryColor").val()),
                     vertical_spacing: parseInt($("#verticalSpacing").val())
                 };
             }
         }
         
         $.ajax({
             url: '/video_preview',
             type: 'POST',
             contentType: 'application/json',
             data: JSON.stringify(data),
             success: function(response) {
                 $("#videoPreviewResponse").html(JSON.stringify(response, null, 2));
             },
             error: function(xhr) {
                 $("#videoPreviewResponse").html("错误: " + xhr.responseText);
             }
         });
     });
    
    // 语音连接
    $("#voiceConnectForm").submit(function(e) {
        e.preventDefault();
        $.ajax({
            url: '/voice_connect',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                video_id: $("#voiceConnectId").val()
            }),
            success: function(response) {
                $("#voiceConnectResponse").html(JSON.stringify(response, null, 2));
            },
            error: function(xhr) {
                $("#voiceConnectResponse").html("错误: " + xhr.responseText);
            }
        });
    });
});

// 颜色值转换函数
function hexToAssColor(hex) {
    // 移除#号
    hex = hex.replace('#', '');
    // 转换为BGR格式（ASS字幕格式）
    const r = parseInt(hex.substr(0, 2), 16);
    const g = parseInt(hex.substr(2, 2), 16);
    const b = parseInt(hex.substr(4, 2), 16);
    return `&H${b.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${r.toString(16).padStart(2, '0')}`;
}

// 下载文件函数
function downloadFile(type) {
    var videoId = $("#downloadId").val();
    if (!videoId) {
        alert("请输入视频ID");
        return;
    }
    
    var url = '';
    switch(type) {
        case 'yt':
            url = '/yt/' + videoId;
            break;
        case 'audio':
            url = '/audio/' + videoId;
            break;
        case 'audio_no_bg':
            url = '/audio_no_bg/' + videoId;
            break;
        case 'audio_bg':
            url = '/audio_bg/' + videoId;
            break;
        case 'srt_en':
            url = '/srt_en/' + videoId;
            break;
        case 'srt_en_merged':
            url = '/srt_en_merged/' + videoId;
            break;
        case 'srt_zh_merged':
            url = '/srt_zh_merged/' + videoId;
            break;
        case 'srt_bilingual':
            url = '/srt_bilingual/' + videoId;
            break;
        case 'tts':
            url = '/tts/' + videoId;
            break;
        case 'voice_connect':
            url = '/voice_connect/' + videoId;
            break;
        case 'voice_connect_log':
            url = '/voice_connect_log/' + videoId;
            break;
        
    }
    
    if (url) {
        window.open(url, '_blank');
    }
}
</script>
